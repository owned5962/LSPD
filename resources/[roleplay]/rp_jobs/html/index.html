<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pôle Emploi Los Santos - 50 Métiers</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="jobcenter-app" class="hidden">
        <div class="jobcenter-window">
            <div class="header">
                <div>
                    <div class="badge">AGENCE OFFICIELLE DU TRAVAIL</div>
                    <h1>Pôle Emploi San Andreas</h1>
                    <p>Faites votre choix parmi nos <span id="jobs-count">50</span> métiers disponibles dans la métropole</p>
                </div>
                <button class="close-btn" id="close-jobcenter">&times;</button>
            </div>

            <div class="search-and-filters">
                <div class="search-input-wrap">
                    <i class="fas fa-search"></i>
                    <input type="text" id="job-search" placeholder="Rechercher un métier, mot-clé, spécialité...">
                </div>
                <div class="filter-categories">
                    <button class="filter-btn active" data-cat="all">Tous (50)</button>
                    <button class="filter-btn" data-cat="artisanat">Artisanat</button>
                    <button class="filter-btn" data-cat="transport">Transport</button>
                    <button class="filter-btn" data-cat="industrie">Industrie</button>
                    <button class="filter-btn" data-cat="public_service">Service Public</button>
                    <button class="filter-btn" data-cat="commerce">Commerce</button>
                    <button class="filter-btn" data-cat="divertissement">Divertissement</button>
                </div>
            </div>

            <div class="jobs-grid" id="jobs-container">
                <!-- Dynamically generated job cards -->
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
