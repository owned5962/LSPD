<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- TextUI Floating Badge -->
    <div id="textui-container" class="hidden">
        <div class="textui-badge">
            <div class="textui-icon"><i class="fa-solid fa-hand-pointer"></i></div>
            <div class="textui-content" id="textui-text">[E] Interagir</div>
        </div>
    </div>

    <!-- Persistent player HUD -->
    <div id="player-hud" class="hidden" aria-live="off">
        <div class="hud-identity">
            <span class="hud-job-icon"><i class="fa-solid fa-id-badge"></i></span>
            <div><strong id="hud-job">Sans-emploi</strong><small id="hud-grade">Citoyen</small></div>
        </div>
        <div class="hud-money">
            <span><i class="fa-solid fa-wallet"></i> <b id="hud-cash">0 $</b></span>
            <span><i class="fa-solid fa-building-columns"></i> <b id="hud-bank">0 $</b></span>
        </div>
        <div class="hud-vitals">
            <div class="hud-vital"><i class="fa-solid fa-heart-pulse"></i><div class="hud-track"><span id="hud-health-bar"></span></div><b id="hud-health">100%</b></div>
            <div class="hud-vital"><i class="fa-solid fa-shield-halved"></i><div class="hud-track"><span id="hud-armor-bar"></span></div><b id="hud-armor">0%</b></div>
            <div class="hud-vital"><i class="fa-solid fa-utensils"></i><div class="hud-track"><span id="hud-hunger-bar"></span></div><b id="hud-hunger">100%</b></div>
            <div class="hud-vital"><i class="fa-solid fa-droplet"></i><div class="hud-track"><span id="hud-thirst-bar"></span></div><b id="hud-thirst">100%</b></div>
        </div>
    </div>

    <div id="vehicle-hud" class="hidden" aria-live="off">
        <div class="speedometer-ring"><span class="speed-caption">KM/H</span><strong id="vehicle-speed">0</strong><span class="speed-gear" id="vehicle-gear">N</span></div>
        <div class="vehicle-fuel"><i class="fa-solid fa-gas-pump"></i><div class="fuel-track"><span id="vehicle-fuel-bar"></span></div><b id="vehicle-fuel">100%</b></div>
    </div>

    <div id="rp-notifications" aria-live="polite"></div>

    <!-- Animated Action Progress Bar -->
    <div id="progress-container" class="hidden">
        <div class="progress-box">
            <div class="progress-header">
                <span id="progress-label">Action en cours...</span>
                <span id="progress-percentage">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="progress-hint"><i class="fa-solid fa-keyboard"></i> Appuyez sur <strong>X</strong> pour annuler</div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
