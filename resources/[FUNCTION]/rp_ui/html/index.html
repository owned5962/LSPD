<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- TextUI Floating Badge -->
    <div id="textui-container" class="hidden">
        <div class="textui-badge">
            <div class="textui-icon"><i class="fa-solid fa-hand-pointer"></i></div>
            <div class="textui-content" id="textui-text">[E] Interagir</div>
        </div>
    </div>

    <!-- Animated Action Progress Bar -->
    <div id="progress-container" class="hidden">
        <div class="progress-box">
            <div class="progress-header">
                <span id="progress-label">Action en cours...</span>
                <span id="progress-percentage">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="progress-hint"><i class="fa-solid fa-keyboard"></i> Appuyez sur <strong>X</strong> pour annuler</div>
        </div>
    </div>

    <!-- Custom HUD: vital indicators sit beside the minimap, never below it. -->
    <section id="player-hud" class="hidden" aria-label="Informations du joueur">
        <div class="hud-vital">
            <span class="hud-vital-icon">♥</span>
            <div class="hud-vital-track"><div id="hud-health-fill" class="hud-vital-fill health"></div></div>
            <span id="hud-health-value" class="hud-vital-value">100</span>
        </div>
        <div class="hud-vital">
            <span class="hud-vital-icon">◆</span>
            <div class="hud-vital-track"><div id="hud-armour-fill" class="hud-vital-fill armour"></div></div>
            <span id="hud-armour-value" class="hud-vital-value">0</span>
        </div>
    </section>

    <!-- Digital speedometer, visible only while inside a vehicle. -->
    <section id="vehicle-speedometer" class="hidden" aria-label="Compteur du véhicule">
        <div class="speedometer-main">
            <span id="vehicle-speed">0</span>
            <span class="speedometer-unit">KM/H</span>
        </div>
        <div class="speedometer-divider"></div>
        <div class="fuel-row">
            <span class="fuel-icon">⛽</span>
            <div class="fuel-track"><div id="vehicle-fuel-fill" class="fuel-fill"></div></div>
            <span id="vehicle-fuel-value">0%</span>
        </div>
    </section>

    <script src="js/app.js"></script>
</body>
</html>
