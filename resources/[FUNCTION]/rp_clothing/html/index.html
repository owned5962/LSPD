<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Boutique de vêtements</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="clothing-wrapper" class="hidden">
        <div class="clothing-card">
            <div class="clothing-header">
                <div class="clothing-title"><i class="fa-solid fa-shirt"></i> Dressing & Prêt-à-porter</div>
                <button id="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="outfit-presets">
                <button class="preset-btn" data-outfit="civil"><i class="fa-solid fa-person"></i> Tenue Civile</button>
                <button class="preset-btn" data-outfit="suit"><i class="fa-solid fa-user-tie"></i> Costume Chic</button>
                <button class="preset-btn" data-outfit="sport"><i class="fa-solid fa-person-running"></i> Sport & Détente</button>
                <button class="preset-btn" data-outfit="work"><i class="fa-solid fa-hard-hat"></i> Uniforme de travail</button>
            </div>
            <div class="save-box">
                <input type="text" id="outfit-name" placeholder="Nom de la tenue (ex: Rendez-vous)" class="name-input">
                <button class="save-btn" id="btn-save"><i class="fa-solid fa-floppy-disk"></i> Enregistrer (150 $)</button>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
