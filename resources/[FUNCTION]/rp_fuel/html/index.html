<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Station-service</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head>
<body><main id="fuel-panel" class="hidden">
<header><div><span class="eyebrow">LOS SANTOS FUEL</span><h1><i class="fa-solid fa-gas-pump"></i> Station-service</h1></div><button id="close" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button></header>
<div class="vehicle"><span>VÉHICULE</span><strong id="vehicle-name">Véhicule</strong><span>CARBURANT ACTUEL</span><strong id="fuel-current">0%</strong></div>
<section class="purchase"><label for="litres">Quantité souhaitée <strong><span id="litres-value">10</span> litres</strong></label><input id="litres" type="range" min="1" max="100" value="10"><div class="range-labels"><span>1 L</span><span>Plein du réservoir</span></div><div class="price"><span>Prix par litre</span><b id="unit-price">6 $</b></div><div class="price total"><span>Total à payer</span><b id="total-price">60 $</b></div></section>
<label class="payment-label" for="payment">Moyen de paiement</label><select id="payment"><option value="auto">Automatique : espèces puis banque</option><option value="cash">Espèces sur moi</option><option value="bank">Compte bancaire</option></select>
<button id="pay" class="pay"><i class="fa-solid fa-credit-card"></i> Confirmer le paiement</button><p id="status">Le serveur vérifie votre solde avant tout débit.</p>
</main><script src="js/app.js"></script></body></html>
