<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creator Control</title><link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<main id="tablet" class="hidden">
  <header><div class="brand"><i class="fa-solid fa-crown"></i><div><strong>CREATOR CONTROL</strong><small>LOS SANTOS STORIES · <span id="role">CRÉATEUR</span></small></div></div><button id="close" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button></header>
    <nav class="creator-tabs" role="tablist" aria-label="Sections du Creator">
    <button type="button" class="creator-tab active" data-tab="weather"><i class="fa-solid fa-cloud-sun"></i> Météo</button>
    <button type="button" class="creator-tab" data-tab="announcement"><i class="fa-solid fa-bullhorn"></i> Annonce</button>
    <button type="button" class="creator-tab" data-tab="mapping"><i class="fa-solid fa-cubes"></i> Map / Mapping</button>
    <button type="button" class="creator-tab" data-tab="blips"><i class="fa-solid fa-map-pin"></i> Blips</button>
    <button type="button" class="creator-tab" data-tab="configuration"><i class="fa-solid fa-sliders"></i> Configuration</button>
    <button type="button" class="creator-tab" data-tab="players"><i class="fa-solid fa-users-gear"></i> Joueurs</button>
    <button type="button" class="creator-tab" data-tab="jobs"><i class="fa-solid fa-briefcase"></i> Job</button>
    <button type="button" class="creator-tab" data-tab="gangs"><i class="fa-solid fa-users"></i> Gang</button>
    <button type="button" class="creator-tab" data-tab="bank"><i class="fa-solid fa-building-columns"></i> Banque Job</button>
    <button type="button" class="creator-tab" data-tab="weapons"><i class="fa-solid fa-shield-halved"></i> Armes</button>
    <button type="button" class="creator-tab" data-tab="statistics"><i class="fa-solid fa-chart-pie"></i> Statistiques</button>
    <button type="button" id="close-sidebar" class="creator-tab" style="margin-top:auto;color:#f87171;"><i class="fa-solid fa-xmark"></i> Fermer</button>
  </nav>
  <!-- NOTE: body panels are loaded from previous full document; see app.js bindings -->
</main>
<script src="app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var closeSide = document.getElementById('close-sidebar');
  var closeMain = document.getElementById('close');
  if (closeSide && closeMain) closeSide.addEventListener('click', function () { closeMain.click(); });
});
</script>
</body>
</html>
