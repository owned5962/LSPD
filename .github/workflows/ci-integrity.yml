name: CI integrity and verification

on:
  push:
    branches: [main, "fix/**", "codex/**", "feature/**", "audit/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Repo integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Integrity checks (truncated files, manifests, CSS imports)
        run: |
          python tests/test_repo_integrity.py
          python tests/test_css_loading.py

  static:
    name: Lua / JS / core tests
    runs-on: ubuntu-latest
    needs: integrity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Install pytest
        run: python -m pip install pytest
      - name: Core Python verification suite
        run: |
          python tests/verify_server.py
          python tests/test_security_regressions.py
          python tests/test_admin_f10_open.py
          python tests/test_player_session_contract.py
          python -m pytest -q tests/test_f4_tablet.py tests/test_staff_tablet_visual_consistency.py
      - name: Compile all Lua resources
        shell: bash
        run: |
          set -uo pipefail
          errors=0
          while IFS= read -r -d '' file; do
            if ! luac5.4 -p "$file"; then
              echo "FAIL $file"
              errors=$((errors + 1))
            fi
          done < <(find resources -type f -name '*.lua' -print0)
          if [ "$errors" -ne 0 ]; then
            echo "Lua syntax errors: $errors"
            exit 1
          fi
      - name: Check NUI JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find resources -type f -name '*.js' -print0)

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [integrity, static]
    if: always()
    steps:
      - name: Report
        run: |
          echo "integrity=${{ needs.integrity.result }}"
          echo "static=${{ needs.static.result }}"
          if [ "${{ needs.integrity.result }}" != "success" ] || [ "${{ needs.static.result }}" != "success" ]; then
            exit 1
          fi
