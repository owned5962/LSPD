name: RP security and persistence checks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  static-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run regression checks
        run: python tests/test_security_regressions.py
      - name: Verify requested server UI and gameplay updates
        run: python tests/test_requested_server_updates.py
      - name: Check modified NUI JavaScript syntax
        run: |
          node --check 'resources/[CORE]/rp_characters/html/js/app.js'
          node --check 'resources/[FUNCTION]/rp_tablet_creator/html/app.js'
          node --check 'resources/[FUNCTION]/rp_tablet_admin/html/js/app.js'
          node --check 'resources/[FUNCTION]/rp_tablet_job/html/app.js'
          node --check 'resources/[FUNCTION]/rp_inventory/html/js/app.js'
