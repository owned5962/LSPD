name: RP security and persistence checks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  static-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run regression checks
        run: python tests/test_security_regressions.py
