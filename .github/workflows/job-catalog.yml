name: Job catalog and database seed

on:
  push:
    paths:
      - "resources/[FUNCTION]/rp_jobs/shared/jobs_list.lua"
      - "database.sql"
      - "tests/test_job_catalog_seed.py"
      - ".github/workflows/job-catalog.yml"
  pull_request:
    paths:
      - "resources/[FUNCTION]/rp_jobs/shared/jobs_list.lua"
      - "database.sql"
      - "tests/test_job_catalog_seed.py"
      - ".github/workflows/job-catalog.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate jobs and SQL seed
        run: python tests/test_job_catalog_seed.py
      - name: Compile job catalog Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          luac5.4 -p "resources/[FUNCTION]/rp_jobs/shared/jobs_list.lua"
