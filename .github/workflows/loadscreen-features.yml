name: Loadscreen live updates and layout validation

on:
  push:
    paths:
      - "resources/**/rp_loadscreen/**"
      - "tests/test_loadscreen_features.py"
      - ".github/workflows/loadscreen-features.yml"
  pull_request:
    paths:
      - "resources/**/rp_loadscreen/**"
      - "tests/test_loadscreen_features.py"
      - ".github/workflows/loadscreen-features.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run loadscreen regression checks
        run: python tests/test_loadscreen_features.py
      - name: Check NUI JavaScript syntax
        run: node --check "resources/[FUNCTION]/rp_loadscreen/html/js/app.js"
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Compile loadscreen Lua scripts
        run: |
          luac5.4 -p "resources/[FUNCTION]/rp_loadscreen/client/main.lua"
          luac5.4 -p "resources/[FUNCTION]/rp_loadscreen/server/main.lua"
