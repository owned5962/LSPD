name: Clothing catalog verification

on:
  push:
    paths:
      - "resources/[FUNCTION]/rp_clothing/**"
      - "tests/test_clothing_catalog.py"
      - ".github/workflows/clothing-catalog.yml"
  pull_request:
    paths:
      - "resources/[FUNCTION]/rp_clothing/**"
      - "tests/test_clothing_catalog.py"
      - ".github/workflows/clothing-catalog.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Test clothing catalog
        run: python -m pytest -q tests/test_clothing_catalog.py
      - name: Install Lua and Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 nodejs
      - name: Validate Lua syntax
        run: luac5.4 -p "resources/[FUNCTION]/rp_clothing/client/main.lua"
      - name: Validate JavaScript syntax
        run: node --check "resources/[FUNCTION]/rp_clothing/html/js/app.js"
