name: Anticheat statistics verification

on:
  push:
    branches: [main, "fix/**"]
    paths:
      - "resources/**"
      - "tests/test_anticheat_statistics.py"
      - "tests/test_anticheat_hardening.py"
      - "database.sql"
      - ".github/workflows/anticheat-statistics.yml"
  pull_request:
    branches: [main]
    paths:
      - "resources/**"
      - "tests/test_anticheat_statistics.py"
      - ".github/workflows/anticheat-statistics.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Run anticheat regression checks
        run: |
          python tests/test_anticheat_statistics.py
          python tests/test_anticheat_hardening.py
      - name: Validate anticheat Lua syntax
        run: |
          luac -p "resources/[FUNCTION]/rp_anticheat/server/main.lua"
          luac -p "resources/[FUNCTION]/rp_anticheat/client/main.lua"
          luac -p "resources/[FUNCTION]/rp_anticheat/shared/config.lua"
      - name: Validate anticheat JavaScript syntax
        run: node --check "resources/[FUNCTION]/rp_anticheat/html/js/app.js"

  mysql-migration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Locate MySQL service container
        run: echo "MYSQL_CONTAINER_ID=$(docker ps --filter ancestor=mysql:8.4 --format '{{.ID}}' | head -n 1)" >> "$GITHUB_ENV"
      - name: Prepare legacy schema
        run: |
          docker exec "$MYSQL_CONTAINER_ID" mysql -uroot -proot -e "CREATE DATABASE aegis_legacy CHARACTER SET utf8mb4"
          docker exec "$MYSQL_CONTAINER_ID" mysql -uroot -proot aegis_legacy -e "CREATE TABLE anticheat_event_log (id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY, player_id INT NOT NULL, player_name VARCHAR(100) NOT NULL, detection_type VARCHAR(40) NOT NULL, reason VARCHAR(180) NOT NULL, severity VARCHAR(16) NOT NULL, sanction VARCHAR(16) NOT NULL DEFAULT 'warn') ENGINE=InnoDB"
      - name: Apply consolidated database.sql twice to legacy and fresh databases
        run: |
          docker exec "$MYSQL_CONTAINER_ID" mysql -uroot -proot -e "CREATE DATABASE aegis_fresh CHARACTER SET utf8mb4"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql -uroot -proot aegis_legacy < database.sql
          docker exec -i "$MYSQL_CONTAINER_ID" mysql -uroot -proot aegis_legacy < database.sql
          docker exec -i "$MYSQL_CONTAINER_ID" mysql -uroot -proot aegis_fresh < database.sql
          docker exec -i "$MYSQL_CONTAINER_ID" mysql -uroot -proot aegis_fresh < database.sql
      - name: Verify migration tables and legacy provenance
        run: |
          docker exec "$MYSQL_CONTAINER_ID" mysql -uroot -proot aegis_legacy -e "INSERT INTO anticheat_event_log (player_id, player_name, detection_type, reason, severity) VALUES (1, 'Legacy test', 'other', 'legacy record', 'low'); SELECT source_type FROM anticheat_event_log WHERE player_name = 'Legacy test'; SHOW TABLES LIKE 'anticheat_runtime_config'; SHOW TABLES LIKE 'anticheat_protection_config';"
          docker exec "$MYSQL_CONTAINER_ID" mysql -uroot -proot aegis_fresh -e "SHOW COLUMNS FROM anticheat_event_log LIKE 'source_type'; SHOW TABLES LIKE 'anticheat_runtime_config'; SHOW TABLES LIKE 'anticheat_protection_config';"
