name: Personal garages verification

on:
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'server.cfg'
      - 'tests/test_garage_system.py'
      - '.github/workflows/garage-system.yml'
  pull_request:
    branches: [main]
    paths:
      - 'resources/**'
      - 'server.cfg'
      - 'tests/test_garage_system.py'
      - '.github/workflows/garage-system.yml'
  workflow_dispatch:

jobs:
  garage-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Run garage regression checks
        run: python tests/test_garage_system.py
      - name: Compile garage Lua files
        run: |
          luac5.4 -p 'resources/[FUNCTION]/rp_garages/config.lua'
          luac5.4 -p 'resources/[FUNCTION]/rp_garages/client/main.lua'
          luac5.4 -p 'resources/[FUNCTION]/rp_garages/server/main.lua'
      - name: Check garage NUI JavaScript
        run: node --check 'resources/[FUNCTION]/rp_garages/html/app.js'
