name: Admin tablet Lua validation

on:
  push:
    branches: [main]
    paths:
      - 'resources/[FUNCTION]/rp_tablet_admin/**'
      - '.github/workflows/tablet-admin-lua.yml'
  pull_request:
    branches: [main]
    paths:
      - 'resources/[FUNCTION]/rp_tablet_admin/**'
      - '.github/workflows/tablet-admin-lua.yml'
  workflow_dispatch:

jobs:
  compile-admin-tablet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Compile admin tablet Lua scripts
        run: |
          set -euo pipefail
          luac5.4 -p 'resources/[FUNCTION]/rp_tablet_admin/client/main.lua'
          luac5.4 -p 'resources/[FUNCTION]/rp_tablet_admin/server/main.lua'
          luac5.4 -p 'resources/[FUNCTION]/rp_tablet_admin/server/extended.lua'
