name: Temporary rp_characters Lua syntax check

on:
  push:
    branches:
      - fix/rp-characters-creation-spawn

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Compile rp_characters Lua files
        run: |
          luac5.4 -p 'resources/[CORE]/rp_characters/client/main.lua'
          luac5.4 -p 'resources/[CORE]/rp_characters/server/main.lua'
