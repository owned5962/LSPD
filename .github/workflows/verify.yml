name: FiveM resource verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python -m pip install pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Run complete repository regression suite (all Python tests and Lua unit tests)
        run: |
          python tests/verify_server.py
          python -m pytest -q tests
          lua5.4 tests/test_core_utils.lua

      - name: Compile every Lua file
        shell: bash
        run: |
          set -uo pipefail
          errors=0
          while IFS= read -r -d '' file; do
            if ! luac5.4 -p "$file"; then
              errors=$((errors + 1))
            fi
          done < <(find resources -type f -name '*.lua' -print0)
          if [ "$errors" -ne 0 ]; then
            echo "Lua syntax errors found: $errors"
            exit 1
          fi

      - name: Check every NUI JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find resources -type f -name '*.js' -print0)

      - name: Compile Python tests
        run: python -m compileall -q tests
