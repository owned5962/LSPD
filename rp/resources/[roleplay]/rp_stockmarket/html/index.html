<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>BAWSAQ - Bourse de Los Santos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="stock-container" class="hidden">
        <div class="stock-window">
            <div class="market-header">
                <div class="brand">
                    <div class="brand-logo"><i class="fa-solid fa-arrow-trend-up"></i></div>
                    <div>
                        <div class="brand-name">BAWSAQ TRADING EXCHANGE</div>
                        <div class="market-status"><span class="badge-live">EN DIRECT</span> Indice LS-Composite: <span id="ls-index">+3.42%</span></div>
                    </div>
                </div>
                <div class="user-portfolio-summary">
                    <div class="summary-label">VALEUR DU PORTEFEUILLE</div>
                    <div class="summary-val" id="portfolio-total">184,250 $</div>
                </div>
                <button class="btn-close" onclick="closeStock()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="market-layout">
                <div class="stock-list-panel">
                    <div class="panel-heading">ACTIONS DISPONIBLES</div>
                    <div class="stocks-scroll" id="stocks-container"></div>
                </div>

                <div class="trade-panel">
                    <div class="stock-detail-header">
                        <div>
                            <h2 id="active-stock-name">MAZE BANK FINANCIAL</h2>
                            <span class="stock-ticker-id" id="active-stock-symbol">MAZ / USD</span>
                        </div>
                        <div class="price-box">
                            <div class="current-price" id="active-stock-price">340.50 $</div>
                            <div class="price-change positive" id="active-stock-change">+4.8% aujourd'hui</div>
                        </div>
                    </div>

                    <div class="chart-visual">
                        <div class="chart-bars">
                            <span style="height:40%"></span>
                            <span style="height:55%"></span>
                            <span style="height:48%"></span>
                            <span style="height:70%"></span>
                            <span style="height:62%"></span>
                            <span style="height:85%"></span>
                            <span style="height:78%"></span>
                            <span style="height:92%"></span>
                        </div>
                        <div class="chart-timeframe">7 derniers jours</div>
                    </div>

                    <div class="trade-box">
                        <div class="input-row">
                            <label>Nombre d'actions :</label>
                            <input type="number" id="trade-qty" value="10" min="1">
                        </div>
                        <div class="trade-total-line">
                            <span>Coût total estimé :</span>
                            <span class="total-highlight" id="trade-total-cost">3,405 $</span>
                        </div>

                        <div class="trade-actions">
                            <button class="btn-buy" onclick="executeTrade('buy')"><i class="fa-solid fa-circle-arrow-up"></i> Acheter</button>
                            <button class="btn-sell" onclick="executeTrade('sell')"><i class="fa-solid fa-circle-arrow-down"></i> Vendre</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
