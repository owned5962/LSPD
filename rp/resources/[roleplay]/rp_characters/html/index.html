<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Création de Personnage - GTA RP</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="registration-app" class="hidden">
        <div class="creator-wrapper">
            <div class="header">
                <div class="badge">ÉTAT DE SAN ANDREAS</div>
                <h1>Enregistrement Civil</h1>
                <p>Définissez votre identité et personnalisez votre avatar pour commencer votre aventure</p>
            </div>

            <form id="creator-form">
                <div class="tabs">
                    <button type="button" class="tab-btn active" data-tab="identity">Identité</button>
                    <button type="button" class="tab-btn" data-tab="appearance">Apparence</button>
                    <button type="button" class="tab-btn" data-tab="spawn">Arrivée</button>
                </div>

                <!-- Step 1: Identity -->
                <div class="tab-content active" id="identity-tab">
                    <div class="form-group">
                        <label for="firstname">Prénom RP</label>
                        <input type="text" id="firstname" required placeholder="Ex: Jean">
                    </div>
                    <div class="form-group">
                        <label for="lastname">Nom de Famille RP</label>
                        <input type="text" id="lastname" required placeholder="Ex: Dupont">
                    </div>
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="dateofbirth">Date de Naissance</label>
                            <input type="date" id="dateofbirth" required value="1998-05-14">
                        </div>
                        <div class="form-group half">
                            <label for="gender">Sexe</label>
                            <select id="gender">
                                <option value="m">Homme</option>
                                <option value="f">Femme</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="height">Taille (cm) : <span id="height-val">175</span> cm</label>
                        <input type="range" id="height" min="150" max="205" value="175">
                    </div>
                </div>

                <!-- Step 2: Appearance -->
                <div class="tab-content" id="appearance-tab">
                    <div class="form-group">
                        <label for="hair-style">Style de Coiffure : <span id="hair-val">4</span></label>
                        <input type="range" id="hair-style" min="0" max="30" value="4">
                    </div>
                    <div class="form-group">
                        <label for="hair-color">Couleur des Cheveux</label>
                        <div class="color-palette">
                            <span class="color-dot active" data-color="0" style="background:#1c1713;"></span>
                            <span class="color-dot" data-color="1" style="background:#4b382a;"></span>
                            <span class="color-dot" data-color="2" style="background:#8b5a2b;"></span>
                            <span class="color-dot" data-color="3" style="background:#c69c6d;"></span>
                            <span class="color-dot" data-color="4" style="background:#555555;"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="clothing-style">Style Vestimentaire</label>
                        <select id="clothing-style">
                            <option value="casual">Casual / Urbain</option>
                            <option value="business">Costume / Élégant</option>
                            <option value="worker">Ouvrier / Résistant</option>
                            <option value="sport">Sportswear</option>
                        </select>
                    </div>
                </div>

                <!-- Step 3: Spawn Point -->
                <div class="tab-content" id="spawn-tab">
                    <label>Sélectionnez votre point de départ :</label>
                    <div class="spawn-cards">
                        <div class="spawn-card active" data-spawn="airport">
                            <div class="spawn-title">✈️ Aéroport de LS</div>
                            <div class="spawn-desc">Arrivée en ville par vol commercial</div>
                        </div>
                        <div class="spawn-card" data-spawn="train">
                            <div class="spawn-title">🚆 Gare Centrale</div>
                            <div class="spawn-desc">Arrivée au cœur de Los Santos</div>
                        </div>
                        <div class="spawn-card" data-spawn="jobcenter">
                            <div class="spawn-title">🏢 Pôle Emploi</div>
                            <div class="spawn-desc">Prêt à trouver votre premier travail</div>
                        </div>
                    </div>
                </div>

                <div class="footer-actions">
                    <button type="button" id="prev-btn" class="btn secondary">Précédent</button>
                    <button type="button" id="next-btn" class="btn primary">Suivant</button>
                    <button type="submit" id="submit-btn" class="btn success hidden">Confirmer & Créer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
