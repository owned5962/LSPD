## --- ACE / FOUNDER ---
add_ace group.admin command allow
add_ace group.admin rp_admin allow
add_ace group.admin command.quit deny
add_principal identifier.fivem:12219878 group.fondateur
add_ace group.fondateur command allow
add_ace group.fondateur rp_admin allow
add_ace group.fondateur rp_founder allow
add_ace group.fondateur command.quit deny
add_ace resource.rp_core command.add_ace allow
add_ace resource.rp_core command.add_principal allow
