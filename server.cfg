# ====================================================================
# FiveM Server Configuration - GTA 5 Roleplay (French / International)
# 50 Métiers | Économie | Création de Personnage | Loadscreen | Menu Admin Tablette
# ====================================================================

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# Server info
sv_hostname "GTA 5 RP FiveM - Serveur 50 Metiers & Tablette Admin"
sets sv_projectName "FiveM Roleplay Server"
sets sv_projectDesc "Serveur GTA 5 RP avec 50 métiers, économie complète, création de personnage et tablette admin"
sets locale "fr-FR"
sets tags "roleplay, rp, fr, custom, jobs, economy, tablet, loadscreen"

# Server slots
sv_maxclients 48

# Steam Web API key (optional if using pure FiveM identifiers)
set steam_webApiKey ""

# FiveM license key (Set your server key from keymaster.fivem.net)
sv_licenseKey "CHANGEME_KEYMASTER_LICENSE"

# MySQL / MariaDB connection string
set mysql_connection_string "mysql://root:password@127.0.0.1/fivem_rp?charset=utf8mb4"

# OneSync configuration
set onesync on
set onesync_distanceCullVehicles true
set onesync_forceMigration true

# Voice system (pma-voice / internal)
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_enableSubmix 1
setr voice_defaultCycle "Z"
setr voice_defaultVolume 0.3

# Base Game Configuration
sv_scriptHookAllowed 0
sv_enforceGameBuild 2944

# Banner details
# sets banner_detail "https://url.to/image.png"
# sets banner_connecting "https://url.to/image.png"

# Permissions (Admin ACE setup)
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace group.admin rp_admin allow
add_principal identifier.fivem:1 group.admin

# ====================================================================
# Resources Startup Order
# ====================================================================

# Default FiveM resources
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure baseevents

# Database connector
# ensure oxmysql # or ghmattimysql

# Custom Roleplay System Resources
ensure rp_loadscreen
ensure rp_core
ensure rp_characters
ensure rp_economy
ensure rp_jobs
ensure rp_tablet_admin
