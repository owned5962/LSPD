## ===================================================================
## FiveM Roleplay Server Configuration
## Modular ESX-like Architecture + 50 Dedicated Job Packages
## ===================================================================

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_maxclients 64
sv_licenseKey "CHANGEME_FIVEM_KEY"
set steam_webApiKey "CHANGEME_STEAM_API_KEY"

## Database Connection
set mysql_connection_string "mysql://root:password@127.0.0.1/fivem_rp?charset=utf8mb4"
set mysql_slow_query_warning 150

## Server Branding
sv_hostname "^4[FR/QC] ^2Los Santos Roleplay ^7| ^350 Metiers ^7| ^5Tablette Staff ^7| ^6Economie Realiste"
sets sv_projectName "Los Santos Roleplay"
sets sv_projectDesc "Serveur GTA 5 RP complet avec 50 metiers, tablette admin, creation de personnage, banques et economie"
sets locale "fr-FR"
sets tags "roleplay, rp, custom, fr, qc, jobs, economy, tablet, cars, serious"

## Voice & Sync
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_defaultCycle "Z"
setr voice_defaultVolume 0.3
onesync on

## Core Standalone Resources
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure hardcap
ensure baseevents

