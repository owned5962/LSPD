## FiveM RP server configuration
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 64
sv_licenseKey "CHANGEME_FIVEM_KEY"
set steam_webApiKey "CHANGEME_STEAM_API_KEY"

## Database: create a dedicated SQL user and replace these placeholders.
set mysql_connection_string "mysql://fivem_user:CHANGE_ME@127.0.0.1/fivem_rp?charset=utf8mb4"
set mysql_slow_query_warning 150

sv_hostname "^4[FR/QC] ^2Los Santos Roleplay ^7| ^350 Metiers ^7| ^5Tablette Staff"
sets sv_projectName "Los Santos Roleplay"
sets sv_projectDesc "Serveur GTA 5 RP avec personnages persistants, 50 metiers et economie"
sets locale "fr-FR"
sets tags "roleplay, rp, custom, fr, jobs, economy, tablet"
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_defaultCycle "Z"
setr voice_defaultVolume 0.3
onesync on

